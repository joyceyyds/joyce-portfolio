    <meta
      name="description"
      content="Joyce 的个人作品集，展示 Product、AI、Content 与 Film 相关项目与创作。"
    />
    <meta name="keywords" content="Joyce, Portfolio, Product, AI, Content, Film, 产品策划, AI产品, 内容创作, 作品集">
    <title>Joyce Portfolio</title>
  </head>
  <body>
    <script>
      (function (location) {
        if (location.search.indexOf('?/') !== 0) return;

        var decoded = location.search
          .slice(2)
          .split('&')
          .map(function (part) { return part.replace(/~and~/g, '&'); })
          .join('?');

        window.history.replaceState(
          null,
          '',
          location.pathname.replace(/\/$/, '') + '/' + decoded + location.hash
        );
      }(window.location));
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
